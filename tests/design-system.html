<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificación del diseño compartido</title><link rel="stylesheet" href="../styles.css"></head>
<body><main id="app"><h1>Diseño compartido</h1><p id="resultado" role="status">Comprobando…</p>
<section class="card stack"><h2>Datos del familiar — prueba sin guardar</h2>
<label class="stack">Médico<input type="text" value="Profesional de ejemplo"></label>
<label class="stack">Notas<textarea>Datos de ejemplo, sin conexión a la base.</textarea></label>
<button class="btn btn--inicio" disabled>Guardar deshabilitado</button></section>
<nav class="tabs" role="tablist"><button class="tabs__tab is-active" role="tab" aria-selected="true">Miembros</button><button class="tabs__tab" role="tab">Datos médicos</button></nav>
<section id="muestras" class="stack"></section>
<section class="modal"><h2 class="modal__titulo">Ventana de ejemplo</h2><button class="modal__close" aria-label="Cerrar ventana">×</button><div class="modal__acciones"><button class="btn">Cancelar</button><button class="btn btn--inicio">Confirmar</button></div></section>
</main><script>
const params = new URLSearchParams(location.search);
document.body.dataset.mode = params.get('modo') === 'dashboard' ? 'dashboard' : 'simple';
document.body.dataset.adminTab = 'salud';
if (params.has('grande')) document.documentElement.style.fontSize = '200%';
const variants = ['btn','btn btn--inicio','btn btn--familia','btn btn--medico','btn btn--emergencia','btn btn--danger','btn btn--xl','btn btn--mini','btn btn--pense','btn btn--anecdota','btn btn--tutoriales','btn btn--panico','tarjeton tarjeton--medico','nube-mic','nube-atajo nube-atajo--familia','nube-atajo nube-atajo--remedios','nube-emergencia','barra-volver__btn','avisos-pin','avisos-inicio__accion','avisos-oferta__si','avisos-oferta__no','checkin-estado-item__pedir','miembros-modal-item__edit','historia-tab-row__play','bio-aprobar','bio-rechazar','bio-editar','bio-escuchar'];
const target = document.getElementById('muestras');
variants.forEach((classes, i) => {
    const button = document.createElement('button'); button.className = classes; button.textContent = 'Acción ' + (i + 1); target.append(button);
});
window.addEventListener('load', () => requestAnimationFrame(() => {
    const errors = [];
    for (const button of document.querySelectorAll('button')) {
        const style = getComputedStyle(button), box = button.getBoundingClientRect();
        if (box.height < 43.9 || box.width < 43.9) errors.push(button.className + ': área táctil insuficiente');
        if (!style.fontFamily.includes('Atkinson')) errors.push(button.className + ': fuente distinta');
        if (!button.matches('.modal__close') && style.borderRadius !== '22px') errors.push(button.className + ': radio distinto');
        if (!button.disabled && !style.backgroundImage.includes('linear-gradient')) errors.push(button.className + ': falta superficie compartida');
    }
    if (document.documentElement.scrollWidth > document.documentElement.clientWidth + 1) errors.push('Desborde horizontal');
    document.getElementById('resultado').textContent = `${document.body.dataset.mode}: ${document.querySelectorAll('button').length} controles comprobados. Errores: ${errors.length}. ${errors.join('; ')}`;
}));
</script></body></html>
