<!doctype html>
<html lang="es-AR" data-style-state="pending">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf5e9">
    <meta name="description" content="Pensándote — la app para estar cerca de los que están lejos.">

    <title>Pensándote</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">

    <!-- Tipografías: Atkinson Hyperlegible (UI legible para baja visión)
         + Caveat (manuscrita, para textos emocionales).
         Atkinson Hyperlegible es la tipografía base del Braille Institute
         diseñada para máxima legibilidad. Mantenerla. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Plus Jakarta Sans (400/500/700) se suma para el skin "dashboard"
         del familiar (datos y UI). Atkinson + Caveat siguen mandando en el
         modo simple del adulto mayor — ver --font-admin en styles.css. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">

    <!-- Este respaldo no depende de styles.css ni borra la sesión. -->
    <style>
        html[data-style-state="pending"] body > :not(#style-recovery) { visibility: hidden; }
        html[data-style-state="failed"] body > :not(#style-recovery) { display: none; }
        #style-recovery { display: none; }
        html:not([data-style-state="ready"]) #style-recovery {
            display: block; box-sizing: border-box; max-width: 34rem;
            margin: 3rem auto; padding: 1.5rem; border: 2px solid #111;
            border-radius: 22px; background: #fffdf6; color: #111;
            font: 1.25rem/1.5 system-ui, sans-serif; text-align: center;
        }
        html:not([data-style-state="ready"]) body { margin: 1rem; background: #faf5e9; }
        #style-recovery button {
            font: inherit; padding: 1rem; border-radius: 14px;
            border: 2px solid #111; background: #f4b860; cursor: pointer;
        }
        html[data-style-state="pending"] #style-recovery button { display: none; }
    </style>
    <script>
        (() => {
            let retried = false;
            let timer;
            window.pensandoteStylesLoaded = () => {
                clearTimeout(timer);
                document.documentElement.dataset.styleState = 'ready';
            };
            window.pensandoteStylesFailed = () => {
                clearTimeout(timer);
                if (document.documentElement.dataset.styleState === 'ready') return;
                const link = document.getElementById('app-styles');
                if (!retried && link) {
                    retried = true;
                    link.href = './styles.css?v=avisos44&retry=' + Date.now();
                    timer = setTimeout(window.pensandoteStylesFailed, 10000);
                    return;
                }
                document.documentElement.dataset.styleState = 'failed';
                const explain = () => {
                    const message = document.getElementById('style-recovery-message');
                    if (message) message.textContent = 'No pudimos cargar la pantalla. Tocá “Volver a cargar” para intentarlo de nuevo.';
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', explain, { once: true });
                } else explain();
            };
            timer = setTimeout(window.pensandoteStylesFailed, 10000);
        })();
    </script>
    <link id="app-styles" rel="stylesheet" href="./styles.css?v=avisos44"
          onload="pensandoteStylesLoaded()" onerror="pensandoteStylesFailed()">

    <!-- Config local (SUPABASE_URL + anon/publishable key). NO va al repo.
         Si el archivo no existe, el stub deja la app en "modo demo"
         con los mocks de js/mocks.js. -->
    <script src="./config.js" onerror="this.dataset.missing=1"></script>
    <script>
        // Si config.js faltó o no definió la URL, dejamos el flag para
        // que app.js arranque en modo demo.
        if (!window.PENSANDOTE_CONFIG || !window.PENSANDOTE_CONFIG.SUPABASE_URL) {
            window.PENSANDOTE_CONFIG = { _demo: true };
        }
    </script>
</head>
<body>
    <aside id="style-recovery" role="status" aria-live="polite">
        <h1>Pensándote</h1>
        <p id="style-recovery-message">Preparando la pantalla…</p>
        <button type="button" onclick="window.location.reload()">Volver a cargar</button>
    </aside>
    <!-- Punto de montaje único. app.js decide qué pantalla renderizar -->
    <main id="app" aria-live="polite">
        <div class="boot-loader">
            <p>Cargando Pensándote…</p>
        </div>
    </main>

    <script>
        // Red de seguridad: si un módulo externo, una sesión vieja o la red
        // dejan el arranque pendiente, reemplazamos el loader por una salida
        // clara. El botón limpia sólo los archivos temporales de esta app y
        // vuelve a pedir la versión publicada.
        window.setTimeout(() => {
            if (window.__pensandoteReady) return;
            const app = document.getElementById('app');
            if (!app || !app.querySelector('.boot-loader')) return;
            app.innerHTML = `
                <section class="card stack" style="margin-top:3rem;text-align:center">
                    <h1>Pensándote necesita actualizarse</h1>
                    <p>No pudimos iniciar la aplicación en este intento.</p>
                    <button class="btn btn--xl btn--inicio btn--full" id="btn-recuperar-app" type="button">
                        Actualizar ahora
                    </button>
                </section>`;
            document.getElementById('btn-recuperar-app')?.addEventListener('click', async () => {
                try {
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(regs.map(reg => reg.unregister()));
                    }
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        await Promise.all(keys.filter(k => k.startsWith('pensandote-')).map(k => caches.delete(k)));
                    }
                } finally {
                    window.location.reload();
                }
            });
        }, 12000);
    </script>
    <script type="module" src="./app.js?v=ayudantes58"></script>

    <!-- Registro del service worker (sólo si el navegador lo soporta) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // updateViaCache:'none' → el browser NO usa HTTP cache para
                // pedir el service-worker.js: cada vez que se abre la PWA,
                // se chequea contra red. Sin esto, podía quedarse pegado al
                // SW viejo hasta 24h.
                navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
                    .then(reg => {
                        // Si aparece un SW nuevo esperando, le decimos que
                        // tome el control ya (saltea esperar a que cierren
                        // todas las tabs).
                        reg.addEventListener('updatefound', () => {
                            const sw = reg.installing;
                            if (!sw) return;
                            sw.addEventListener('statechange', () => {
                                if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                                    sw.postMessage('skipWaiting');
                                }
                            });
                        });
                        // Cuando el nuevo SW activa y reclama, recargamos
                        // una sola vez para que la página corra contra el
                        // nuevo shell.
                        let refreshing = false;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (refreshing) return;
                            refreshing = true;
                            window.location.reload();
                        });
                    })
                    .catch(err => console.warn('[sw] no se pudo registrar:', err));
            });
        }
    </script>
</body>
</html>
